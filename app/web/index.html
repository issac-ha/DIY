<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>DIY Agent - 硬件价格分析</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
        .chat-box { background: white; border-radius: 8px; padding: 20px; height: 500px; overflow-y: auto; margin-bottom: 20px; }
        .msg { margin: 10px 0; padding: 10px 15px; border-radius: 8px; max-width: 80%; }
        .user { background: #409eff; color: white; margin-left: auto; }
        .bot { background: #f0f0f0; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        button { padding: 12px 24px; background: #409eff; color: white; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #337ecc; }
        .chart-container { display: none; background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .chart-container.show { display: block; }
        #chart { width: 100%; height: 300px; }
    </style>
</head>
<body>
    <h2>硬件价格分析助手</h2>
    <div class="chat-box" id="chatBox"></div>
    <div class="chart-container" id="chartContainer">
        <div id="chartTitle">价格趋势</div>
        <div id="chart"></div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="输入你的问题，如：RTX 4060 多少钱？" onkeydown="if(event.key==='Enter')send()">
        <button onclick="send()">发送</button>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');

        function addMessage(text, role) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        //画价格趋势折线图
        function renderChart(name,dates,prices){
            const container = document.getElementById('chartContainer');
            const chartDom= document.getElementById('chart');
            document.getElementById('chartTitle').textContent = name + ' 价格趋势';
            
            // 显示图表容器
            container.classList.add('show');

            // 初始化 ECharts 实例
            let chart = echarts.getInstanceByDom(chartDom);
            if (!chart) {
                chart = echarts.init(chartDom);
            }
            //配置图表
            chart.setOption({
               tooltip : {
                    trigger: 'axis'
                },
                xAxis: {
                    type: 'category',
                    data: dates,
                    boundaryGap: false
                },
                yAxis: {
                    type: 'value',
                    name: '价格 (元)'
                },
                series: [{
                    data: prices,
                    type: 'line',
                    smooth: true,
                    areaStyle: {opacity: 0.2},
                    lineStyle: {color: '#409eff'},
                    itemStyle: {color: '#409eff'}
                }]
            });
            //自适应窗口大小
            chart.resize();
        }

        async function send() {
            const msg = userInput.value.trim();
            if (!msg) return;
            addMessage(msg, 'user');
            userInput.value = '';

            try {
                const resp = await fetch('http://127.0.0.1:8000/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: msg})
                });
                const data = await resp.json();
                addMessage(data.reply, 'bot');

                // 判断是否在问价格趋势，是则调用接口画图
                const trendKeywords = ['趋势', '走势', '涨跌', '价格变化', '最近价格'];
                const isTrendQuery = trendKeywords.some(kw => msg.includes(kw));
                if (isTrendQuery) {
                    // 去掉趋势关键词，只保留产品名
                    let keyword = msg;
                    trendKeywords.forEach(kw => { keyword = keyword.replace(kw, ''); });
                    keyword = keyword.trim();
                    try {
                        const trendResp = await fetch('http://127.0.0.1:8000/api/trend?name=' + encodeURIComponent(keyword) + '&days=7');
                        const trendData = await trendResp.json();
                        if (trendData.dates) {
                            renderChart(trendData.name, trendData.dates, trendData.prices);
                        }
                    } catch (e) {
                        console.error('趋势图加载失败：', e);
                    }
                }
            } catch (e) {
                addMessage('请求失败：' + e.message, 'bot');
            }
        }
    </script>
</body>
</html>
